plugins { id 'com.android.application' }
android {
    namespace 'org.echogesture.app'
    compileSdk 35
    defaultConfig {
        applicationId 'org.echogesture.app'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.0-submission'
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets.main.assets.srcDirs = [layout.buildDirectory.dir('generated/echoAssets')]
    androidResources { noCompress += ['onnx', 'task'] }
}
tasks.register('copyEchoAssets', Sync) {
    from('../../../models') { include 'labels.json', 'holistic_landmarker.task', 'ensemble/*.onnx', 'ensemble/ensemble.json' }
    into layout.buildDirectory.dir('generated/echoAssets')
}
tasks.named('preBuild').configure { dependsOn 'copyEchoAssets' }
dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'com.google.mediapipe:tasks-vision:1.2.3'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.23.2'
}
